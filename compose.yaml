services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: domivra
      POSTGRES_USER: domivra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domivra -d domivra"]
      interval: 5s
      retries: 10
  storage:
    image: chrislusf/seaweedfs:4.22
    command: server -dir=/data -ip.bind=0.0.0.0 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      WEED_S3_SSE_KEK: ${S3_SSE_KEK:?run npm run setup}
    volumes: [storage_data:/data, ./runtime/s3.json:/etc/seaweedfs/s3.json:ro]
    ports: ["127.0.0.1:8333:8333"]
  ai:
    build: ./services/ai
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports: ["127.0.0.1:8000:8000"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://domivra:${POSTGRES_PASSWORD}@postgres:5432/domivra
      API_PORT: "3000"
      WEB_ORIGIN: http://127.0.0.1:5173
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run npm run setup}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run npm run setup}
      S3_BUCKET: domivra-private
      AI_URL: http://ai:8000
      RUNTIME_DIR: /app/runtime
    volumes: [runtime_data:/app/runtime]
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_started}
    ports: ["127.0.0.1:3000:3000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY: http://api:3000
    depends_on: [api]
    ports: ["127.0.0.1:5173:5173"]
volumes:
  postgres_data:
  storage_data:
  runtime_data:
